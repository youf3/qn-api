<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block title %}
    {% endblock %}
    <link href="{{ url_for('static', path='css/all.min.css') }}" rel="stylesheet" type="text/css" />
    <link href="{{ url_for('static', path='css/bootstrap.min.css') }}" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <script type="text/javascript" src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', path='js/vis-network.min.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', path='js/paho-mqtt.min.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', path='js/chart.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', path='js/chartjs-adapter-date-fns.bundle.min.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', path='js/chartjs-plugin-annotation.min.js') }}"></script>
    <script type="text/javascript" src="{{ url_for('static', path='js/dist/bundle.min.js') }}"></script>
    
    <style>
        body {
            padding-bottom: 120px;
        }
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 100px;
            padding: 30px 30px;
        }
        .card-header {
            background-color: #c3e0ff;
            /* Light blue background */
            font-weight: bold;
        }
        #topology-container {
            height: 600px;
            border: 1px solid lightgray;
        }
        #panel1-content {
            height: 150px; /* Set a fixed height */
            overflow-y: auto; /* Enable vertical scrolling */
            border: 1px solid #ddd; /* Optional: Add a subtle border */
            padding: 5px;
            background: #f8f9fa; /* Light gray background */
        }
        .status-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            transition: background-color 0.3s ease-in-out;
        }
        .pulse {
            animation: pulse-animation 0.5s ease-in-out;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .info-icon {
            cursor: pointer;
            font-size: 1.2rem;
            color: #007bff; /* Bootstrap primary blue */
            transition: color 0.3s;
        }
        .info-icon:hover {
            color: #0056b3; /* Darker blue on hover */
        }
        .table-update-highlight {
            background-color: #fff9c4; /* Pale Yellow */
            transition: background-color 1s ease-out;
        }
    </style>
</head>

<body data-username="{{ username }}">
    {% include "components/navbar.html" %}
    {% with alert=alert %}
    {% include "components/alert.html" %}
    {% endwith %}
    {% block content %}
    {% endblock %}
    {% block scripts %}
    {% endblock %}

    {% include "components/footer.html" %}
</body>
</html>
